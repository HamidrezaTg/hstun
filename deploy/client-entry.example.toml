# hstun client, DIRECT mode: dials and is the entry. It owns the client-facing ports.
# Pairs with deploy/server-exit.example.toml. Copy to /etc/hstun/client.toml (0640 root:hstun).
[client]
role        = "entry"
server      = "exit.example.org:23456"   # the exit listener
connect     = ""                         # optional ip:port to dial instead (keeps the name for SNI)
carrier     = "ws"                       # ws | http | chunk | auto
ws_path     = "/hs/ws"                   # must match the exit; CHANGE from the public default
# user_agent  = ""                       # empty = a common browser string
conns       = 2                          # 2 measured as fast as 4 on a real path and looks less uniform
dial_stagger = "2s"                      # first dial of sessions 1.. waits a random 0.5-2 s; "0s" = all at once
secret_file = "/etc/hstun/secret"
name        = "entry-a"
tls_verify  = "spki"                     # system | ca_file | spki (never off)
spki_sha256 = ""                         # sha256 of the exit's public key (hex) for a self-signed cert
tls_mlkem   = false
tls_fingerprint = "chrome"             # ClientHello: chrome | chrome_nopq | firefox | safari | ios | android | go
ping        = "25s"
idle_timeout = "10m"
# drain_timeout = "10s"                    # how long a stopping client lets streams in flight finish (0s = at once)
# padding = "light"                       # off | light | strong
# tls_fragment = "off"                   # off | tcp | record | both: split the first TLS record (defeats first-packet SNI filters)
# session_age = "auto"                   # auto (10-40 min) | off | 30m: replace sessions on a timer (needs conns >= 2)
max_streams_per_session = 256
forward_max_conns_per_ip = 256           # per-source cap on forward/SOCKS ports (0 = off)
admin_listen = "127.0.0.1:9110"          # /stats, loopback only

[[forward]]
name   = "x1"                            # must match a forward name on the exit
listen = "0.0.0.0:20151"                 # client-facing port; open in ufw only when a backend exists

[socks]
enabled = true
listen  = "127.0.0.1:34567"              # loopback only (no authentication)
