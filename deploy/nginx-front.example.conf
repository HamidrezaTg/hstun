# nginx in front of hstun (exit, behind-proxy mode). Pairs with deploy/server-behind-nginx.example.toml.
# What it gives you: nginx's own TLS handshake and headers (hstun's Go server is never seen), the decoy site served by
# nginx, and a reverse proxy for exactly the two secret paths. Anything else is answered by nginx itself.
# Replace the CHANGE paths with the ones in server.toml. Run it as its own unit (nginx -c this-file) or merge the server block.
# Also needed when the port is open to the internet: a per-source connection cap that covers silent connections,
#   iptables -I INPUT 1 -p tcp --dport 443 --syn -m connlimit --connlimit-above 64 --connlimit-mask 32 -j REJECT --reject-with tcp-reset
# (nginx limit_conn only counts requests, and hstun cannot see the real peer behind nginx). Reload nginx after a certificate renewal.
# nginx in front of hstun (exit). Ordinary TLS termination, a static decoy site, and a reverse proxy
# for exactly two paths. Everything else is answered by nginx itself.
user www-data;
worker_processes 1;
pid /run/hstun-nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /run/hstun-nginx/body;
    proxy_temp_path /run/hstun-nginx/proxy;
    fastcgi_temp_path /run/hstun-nginx/fastcgi;
    uwsgi_temp_path /run/hstun-nginx/uwsgi;
    scgi_temp_path /run/hstun-nginx/scgi;

    limit_conn_zone $binary_remote_addr zone=perip:1m;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;
    sendfile on;
    keepalive_timeout 75s;
    client_header_timeout 10s;   # also bounds the TLS handshake
    client_body_timeout 20s;
    send_timeout 20s;

    server {
        listen 0.0.0.0:443 ssl http2;
        server_name tunnel.example.org;
        ssl_certificate     /etc/letsencrypt/live/tunnel.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tunnel.example.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn perip 64;
        client_max_body_size 16m;

        root /var/www/hstun-decoy;
        index index.html;

        # hstun answers 404 for anything it refuses; show nginx's own 404 instead.
        proxy_intercept_errors on;
        error_page 404 @nf;
        location @nf { return 404; }

        location / {
            try_files $uri $uri/ =404;
        }

        # WebSocket carrier: only a real upgrade request reaches hstun.
        location = /CHANGE-ws-path {
            if ($http_upgrade != "websocket") { return 404; }
            proxy_pass https://127.0.0.1:24083;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_verify off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # HTTP carrier: POST only, streamed without buffering.
        location ^~ /CHANGE-http-path/ {
            if ($request_method != POST) { return 404; }
            proxy_pass https://127.0.0.1:24083;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_verify off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
