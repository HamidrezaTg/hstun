name: Feature request
description: An idea for hstun
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        hstun aims to be hard to detect and block (see docs/stealth-plan.md). A new technique is easiest to accept when you can say how
        it would be measured: what a censor sees now, what it would see after, and what it costs.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like hstun to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
