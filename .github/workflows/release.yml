name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: The tag must match the version in the code
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/hstun/main.go)
          [ "$want" = "$have" ] || { echo "tag $want != version $have"; exit 1; }
      - run: scripts/test.sh -short
      - run: scripts/package.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/hstun_*.tar.gz'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/hstun_*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/hstun_*.tar.gz dist/SHA256SUMS \
              --title "hstun ${GITHUB_REF_NAME#v}" --generate-notes
          fi
